version: "3.9"

services:
  rabbit:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9999:9999"
    env_file:
      - ./.env
    depends_on:
      rabbit-migrate:
        condition: service_completed_successfully
    environment:
      RABBIT_TLS_CERT_FILE: /run/rabbit-tls/fullchain.pem
      RABBIT_TLS_KEY_FILE: /run/rabbit-tls/privkey.pem
    volumes:
      - /srv/rabbit/tls:/run/rabbit-tls:ro
    networks:
      rabbit-net:
        ipv4_address: 172.30.0.10 # fixed IP for rabbit inside bridge
      dokploy-network:
        aliases:
          - port.tcp.go

  rabbit-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: /usr/local/bin/rabbit.go database migrate /usr/local/bin/internal/database/migrations.sql
    env_file:
      - ./.env
    networks:
      rabbit-net:
      dokploy-network:
  
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-rabbit
    restart: always
    hostname: port.tcp.go
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./ts-state:/var/lib/tailscale
      - /lib/modules:/lib/modules:ro
    networks:
      rabbit-net:
        ipv4_address: 172.30.0.2
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--hostname=port.tcp.go --advertise-routes=172.30.0.0/24 --accept-routes
      - TS_USERSPACE=false
    sysctls:                          # ADD THIS
      - net.ipv4.ip_forward=1        # Enable IP forwarding
      - net.ipv6.conf.all.forwarding=1
  
  coredns:
    image: coredns/coredns:latest
    container_name: custom-dns
    ports:
      - "5354:53/udp"
      - "5354:53/tcp"
    volumes:
      - ./Corefile:/Corefile
    restart: unless-stopped
    networks:
      rabbit-net:
        ipv4_address: 172.30.0.11

networks:
  rabbit-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  dokploy-network:
    external: true
