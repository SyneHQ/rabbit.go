name: Server container

# Publishes the tunnel server image so deployments can reference a digest
# instead of building from source. The build context is server/, because the
# Dockerfile there copies the whole context and expects main.go at its root.

on:
  push:
    branches: [sudo, main]
    paths:
      - "server/**"
      - ".github/workflows/server-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The branch tag is what a deployment follows day to day; the sha tag is
      # what you pin when you want a release to stay put.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/synehq/rabbit.go
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep a single plain manifest. Attestations add a manifest list that
          # some consumers resolve awkwardly, and nothing here needs them yet.
          provenance: false

      # Printed so a deployment can pin the digest without pulling first.
      - name: Report digest
        run: |
          {
            echo "### Server image published"
            echo
            echo '```'
            echo "ghcr.io/synehq/rabbit.go@${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
